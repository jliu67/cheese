[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qre-two-asset"
version = "12.0.0"
description = "Leakage-aware VOO/KMLM relative-return research engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary research code"}
dependencies = [
  "joblib>=1.4",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["ruff>=0.12"]

[project.scripts]
qre2 = "qre_two_asset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP"]
